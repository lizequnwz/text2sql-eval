[project]
name = "text2sql-eval"
version = "0.2.0"
description = "Three transparent scores for text-to-SQL: row counts, sampled consistency, and SQL semantics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["text-to-sql", "evaluation", "langchain", "llm-as-a-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "pydantic>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/lizequnwz/text2sql-eval"
Issues = "https://github.com/lizequnwz/text2sql-eval/issues"

[project.scripts]
text2sql-eval = "text2sql_eval.cli:main"
text2sql-eval-report = "text2sql_eval.report_cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
